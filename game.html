<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wikipedia Game: Funky Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #ffe600;
      --surface: #ffffff;
      --text-main: #000000;
      --primary: #ff0055;
      --primary-hover: #cc0044;
      --accent: #00e5ff;
      --success: #00ff66;
      --border: #000000;
      --shadow-offset: 6px;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(var(--text-main) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      box-sizing: border-box;
      overflow: hidden;
    }

    h1,
    h2,
    h3 {
      font-family: 'Bungee', cursive;
      margin-top: 0;
      text-transform: uppercase;
    }

    /* Main App Container */
    .container {
      background: var(--surface);
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 95dvh;
      border: 4px solid var(--border);
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border);
      padding: 1.5rem;
      position: relative;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }

    /* --- Funky Buttons --- */
    .btn {
      background-color: var(--primary);
      color: white;
      border: 3px solid var(--border);
      padding: 0.8rem 1.5rem;
      font-family: 'Bungee', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border);
      transition: all 0.1s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
    }

    .btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border);
    }

    .btn:disabled {
      background-color: #ccc;
      color: #666;
      cursor: not-allowed;
      box-shadow: 4px 4px 0px #999;
      transform: none;
    }

    .btn-small {
      padding: 0.6rem 0.8rem;
      font-size: 0.9rem;
      background-color: var(--accent);
      color: var(--text-main);
    }

    .btn-reroll {
      background-color: var(--surface);
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- Loading Spinner --- */
    #loader {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Bungee', cursive;
      font-size: 1.5rem;
      color: var(--primary);
      text-align: center;
    }

    .spin {
      animation: spin 1s linear infinite;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* --- Setup Section --- */
    #setupSection {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 1.5rem;
    }

    /* --- Game Section --- */
    #gameSection {
      display: none;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Header Panel */
    .game-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 4px solid var(--border);
      margin-bottom: 0.5rem;
    }

    .stat-block {
      background: var(--bg);
      border: 3px solid var(--border);
      padding: 0.5rem 1.2rem;
      box-shadow: 4px 4px 0 var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      height: 100%;
      box-sizing: border-box;
    }

    .clickable-stat {
      cursor: pointer;
      background: var(--accent);
      transition: all 0.15s ease;
      position: relative;
      margin: 0 auto;
      min-width: 200px;
      -webkit-tap-highlight-color: transparent;
    }

    .clickable-stat:hover {
      background: #00cce6;
      transform: translate(-3px, -3px);
      box-shadow: 7px 7px 0 var(--border);
    }

    .clickable-stat:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 var(--border);
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 0.2rem;
    }

    .hint-badge {
      background: var(--primary);
      color: white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      border: 2px solid var(--border);
    }

    .stat-value {
      font-family: 'Bungee', cursive;
      font-size: 2rem;
      color: var(--text-main);
    }

    /* Big Word Title */
    .word-display-container {
      text-align: center;
      margin: 1rem 0;
    }

    .current-label {
      font-size: 0.9rem;
      font-weight: bold;
      color: #555;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .word-display {
      font-family: 'Bungee', cursive;
      font-size: 3.5rem;
      color: var(--text-main);
      text-transform: lowercase;
      text-shadow: 3px 3px 0px var(--accent);
      line-height: 1.1;
      margin: 0;
      word-wrap: break-word;
    }

    /* Full Width Choices Grid */
    .play-area {
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      min-height: 0;
      margin-bottom: 1rem;
      overflow: hidden;
      border-top: 2px dashed #ccc;
      padding-top: 1rem;
    }

    #choicesArea {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      overflow-y: auto;
      padding: 0.5rem 1rem 1.5rem 0.5rem;
      align-content: start;
      height: 100%;
      -webkit-overflow-scrolling: touch;
    }

    .def-card {
      background: #f8f9fa;
      border: 3px solid var(--border);
      padding: 1.5rem 1.2rem;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 4px 4px 0 var(--border);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      -webkit-tap-highlight-color: transparent;
    }

    .def-card:hover {
      background: var(--surface);
      transform: translate(-4px, -4px);
      box-shadow: 8px 8px 0 var(--primary);
    }

    .def-card:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0 var(--primary);
    }

    .def-pos {
      font-family: 'Bungee', cursive;
      background: var(--text-main);
      color: var(--surface);
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 1px;
      padding: 0.3rem 0.6rem;
      margin-bottom: 0.8rem;
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0 var(--accent);
    }

    .def-preview {
      color: var(--text-main);
      line-height: 1.5;
      font-weight: 600;
    }

    /* --- Modals --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: var(--surface);
      border: 4px solid var(--border);
      box-shadow: 8px 8px 0 var(--primary);
      padding: 3rem 1.5rem 1.5rem 1.5rem;
      max-width: 800px;
      width: 100%;
      text-align: center;
      position: relative;
      max-height: 85dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content.victory {
      box-shadow: 8px 8px 0 var(--success);
      background: #e6ffed;
    }

    .definition-text-wrapper {
      display: inline-block;
      text-align: center;
      line-height: 1.8;
      font-size: 1.8rem;
      padding: 0.5rem;
    }

    .clickable-word {
      color: var(--text-main);
      cursor: pointer;
      font-weight: 700;
      text-decoration: underline;
      text-decoration-thickness: 4px;
      text-decoration-color: var(--primary);
      transition: all 0.2s ease;
      padding: 0 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .clickable-word:active,
    .clickable-word:hover {
      background-color: var(--primary);
      color: white;
    }

    .close-modal-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: var(--bg);
      border: 3px solid var(--border);
      font-family: 'Bungee', cursive;
      font-size: 1.2rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--border);
      transition: all 0.1s ease;
      z-index: 10;
    }

    .close-modal-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 var(--border);
    }

    .hint-def-list {
      text-align: left;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.6;
      padding-left: 0;
      list-style: none;
      font-weight: 600;
    }

    .hint-def-list li {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px dashed #ddd;
    }

    .hint-def-list li:last-child {
      border-bottom: none;
    }

    /* --- History Trail --- */
    .history-container {
      border-top: 4px solid var(--border);
      padding-top: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      height: 60px;
    }

    .history-title {
      font-weight: 700;
      font-family: 'Bungee', cursive;
      white-space: nowrap;
      color: var(--primary);
    }

    .history-trail {
      display: flex;
      overflow-x: auto;
      white-space: nowrap;
      padding-bottom: 0.5rem;
      flex-grow: 1;
      align-items: center;
      -webkit-overflow-scrolling: touch;
    }

    .history-word {
      font-weight: 700;
      background: var(--bg);
      padding: 0.3rem 0.6rem;
      border: 2px solid var(--border);
      display: inline-block;
      font-size: 1rem;
      box-shadow: 2px 2px 0 var(--border);
    }

    .history-arrow {
      margin: 0 0.5rem;
      font-family: 'Bungee', cursive;
      color: var(--text-main);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
      border: 2px solid var(--surface);
    }

    /* --- Toast Notification --- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(150px);
      background: var(--primary);
      color: white;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 1rem 2rem;
      font-family: 'Bungee', cursive;
      font-size: 1.2rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2000;
      width: 80%;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* =========================================
       📱 MOBILE RESPONSIVE MEDIA QUERIES 📱
       ========================================= */
    @media (max-width: 768px) {
      body {
        padding: 0.5rem;
      }

      .container {
        padding: 1rem 0.8rem;
        border-width: 3px;
      }

      .game-header {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "reroll moves"
          "target target";
        gap: 0.8rem;
      }

      .game-header>div:nth-child(1) {
        grid-area: reroll;
      }

      .game-header>div:nth-child(2) {
        grid-area: target;
      }

      .game-header>div:nth-child(3) {
        grid-area: moves;
        text-align: left;
      }

      .stat-block {
        width: 100%;
        padding: 0.5rem;
      }

      .clickable-stat {
        min-width: unset;
      }

      .stat-value {
        font-size: 1.5rem;
      }

      #setupSection h1 {
        font-size: 3rem !important;
      }

      #setupSection p {
        font-size: 1.1rem !important;
      }

      .word-display {
        font-size: 2.2rem;
      }

      .definition-text-wrapper {
        font-size: 1.4rem;
        line-height: 1.6;
      }

      #targetHintModal h2 {
        font-size: 1.8rem !important;
        margin-top: 1rem;
      }

      #choicesArea {
        grid-template-columns: 1fr;
        gap: 1rem;
        padding-right: 0.5rem;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div id="loader">
      <div class="spin">🌀</div>
      <div id="loaderText">Loading...</div>
      <div id="subLoaderText"
        style="font-family: 'Space Grotesk'; font-size: 1rem; margin-top: 1rem; color: #000; text-align: center; padding: 0 1rem;">
      </div>
    </div>

    <!-- START SCREEN -->
    <div id="setupSection">
      <h1 style="font-size: 4rem; margin-bottom: 0;">Funky Dictionary</h1>
      <p style="font-size: 1.3rem; font-weight: 600; max-width: 600px; line-height: 1.6;">
        Navigate from a RANDOM start word to a RANDOM target word! Beware: Some words are dead ends. Just Reroll!
      </p>
      <button id="startGameBtn" class="btn"
        style="font-size: 1.5rem; padding: 1rem 2rem; width: 100%; max-width: 300px;">Start Game</button>
    </div>

    <!-- GAME SCREEN -->
    <div id="gameSection">

      <!-- Top Bar: Mobile Optimized Grid -->
      <div class="game-header">
        <div>
          <button class="btn btn-small btn-reroll" onclick="startNewGame()" title="Start a fresh game"
            style="width: 100%;">🎲 Reroll</button>
        </div>

        <div class="stat-block clickable-stat" onclick="showTargetHint()" title="Click to view target definition">
          <div class="stat-label">Target Word <span class="hint-badge">?</span></div>
          <div id="targetDisplay" class="stat-value"></div>
        </div>

        <div>
          <div class="stat-block" style="background: var(--success); display: flex;">
            <div class="stat-label" style="justify-content: center;">Moves</div>
            <div id="movesDisplay" class="stat-value text-main">0</div>
          </div>
        </div>
      </div>

      <!-- Current Word -->
      <div class="word-display-container">
        <div class="current-label">Current Word:</div>
        <div id="currentWordDisplay" class="word-display"></div>
      </div>

      <!-- Full Width Layout: Choices Grid -->
      <div class="play-area">
        <div id="choicesArea">
          <!-- Cards injected here -->
        </div>
      </div>

      <!-- Bottom Bar: History -->
      <div class="history-container">
        <div class="history-title">PATH:</div>
        <div class="history-trail" id="historyList"></div>
      </div>

    </div>
  </div>

  <!-- ACTIVE DEFINITION POPUP MODAL -->
  <div id="activeDefModal" class="modal-overlay" onclick="closeActiveModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal-btn" onclick="closeActiveModal()">X</button>
      <div id="modalDefContent" class="definition-text-wrapper"></div>
    </div>
  </div>

  <!-- TARGET HINT MODAL -->
  <div id="targetHintModal" class="modal-overlay"
    onclick="document.getElementById('targetHintModal').style.display='none'">
    <div class="modal-content" onclick="event.stopPropagation()">
      <button class="close-modal-btn"
        onclick="document.getElementById('targetHintModal').style.display='none'">X</button>
      <h2 style="font-size: 2.5rem; margin-bottom: 1.5rem;">Target: <br><span id="hintTitle"
          style="color: var(--primary);"></span></h2>
      <ul id="hintList" class="hint-def-list"></ul>
    </div>
  </div>

  <!-- VICTORY MODAL -->
  <div id="victoryOverlay" class="modal-overlay">
    <div class="modal-content victory">
      <h2 style="font-size: 3rem; margin-bottom: 0;">AWESOME! 🎉</h2>
      <p style="font-size: 1.5rem; font-weight: bold; margin: 2rem 0;">You reached the target in <br><span
          id="finalMoves" style="color: var(--primary); font-size: 3rem; padding: 0 0.5rem; display: block;"></span>
        moves.</p>
      <button class="btn" style="font-size: 1.5rem; width: 100%;" onclick="startNewGame()">Play Again</button>
    </div>
  </div>

  <div id="toast" class="toast">
    <span id="toastMessage">Word not found!</span>
  </div>

      "teach", "student", "teacher", "college", "university", "class", "course", "exam", "test", "grade",
      "degree", "diploma", "job", "career", "boss", "worker", "salary", "wage", "coin", "bill",
      "bank", "wealth", "poor", "rich", "poverty", "charity", "give", "take", "borrow", "lend",
      "buy", "sell", "shop", "store", "market", "price", "cost", "value", "cheap", "expensive"
    ];

    let currentWord = "";
    let targetWord = "";
    let targetDefinitions = [];
    let pathHistory = [];
    let moves = 0;
    let toastTimeout;

    // --- DOM Elements ---
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const subLoaderText = document.getElementById('subLoaderText');
    const startBtn = document.getElementById('startGameBtn');
    const choicesArea = document.getElementById('choicesArea');
    const activeDefModal = document.getElementById('activeDefModal');
    const modalDefContent = document.getElementById('modalDefContent');

    startBtn.addEventListener('click', startNewGame);

    // --- API Logic ---
    async function fetchWordDefinition(word) {
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (!response.ok) return null;

        const data = await response.json();
        let allDefs = [];

        data.forEach(entry => {
          entry.meanings.forEach(meaning => {
            meaning.definitions.forEach(def => {
              allDefs.push({
                partOfSpeech: meaning.partOfSpeech,
                text: def.definition
              });
            });
          });
        });
        return allDefs;
      } catch (error) {
        return null;
      }
    }

    async function getValidRandomWord() {
      while (true) {
        try {
          const randomIndex = Math.floor(Math.random() * wordBank.length);
          const word = wordBank[randomIndex].toLowerCase();

          subLoaderText.textContent = `Testing random word: "${word}"...`;

          const defs = await fetchWordDefinition(word);
          if (defs && defs.length > 0) {
            return {word: word, definitions: defs};
          }
        } catch (e) {
          console.error("API Error during random fetch", e);
        }
      }
    }

    // --- Game Setup ---
    async function startNewGame() {
      moves = 0;
      pathHistory = [];
      document.getElementById('movesDisplay').textContent = moves;
      document.getElementById('victoryOverlay').style.display = 'none';

      document.getElementById('setupSection').style.display = 'none';
      document.getElementById('gameSection').style.display = 'flex';

      loader.style.display = 'flex';

      loaderText.textContent = "Summoning Target Word...";
      const targetData = await getValidRandomWord();
      targetWord = targetData.word;
      targetDefinitions = targetData.definitions;
      document.getElementById('targetDisplay').textContent = targetWord;

      loaderText.textContent = "Summoning Start Word...";
      let startData = await getValidRandomWord();

      while (startData.word === targetWord) {
        startData = await getValidRandomWord();
      }

      subLoaderText.textContent = "";
      await navigateToWord(startData.word, true, startData.definitions);

      loader.style.display = 'none';
    }

    // --- Navigation Logic ---
    window.handleWordClick = async function (word) {
      closeActiveModal();

      const cleanWord = word.replace(/^[^\w]+|[^\w]+$/g, '').toLowerCase();

      loader.style.display = 'flex';
      loaderText.textContent = `Searching for "${cleanWord}"...`;

      const definitions = await fetchWordDefinition(cleanWord);
      loader.style.display = 'none';

      if (!definitions || definitions.length === 0) {
        showToast(`Bummer! "${cleanWord}" wasn't found in the API.`);
        return;
      }

      navigateToWord(cleanWord, false, definitions);
    }

    async function navigateToWord(word, isStart = false, preFetchedDefs = null) {
      let definitions = preFetchedDefs;

      if (isStart && !preFetchedDefs) {
        loader.style.display = 'flex';
        definitions = await fetchWordDefinition(word);
        loader.style.display = 'none';
      }

      currentWord = word;

      if (!isStart) {
        moves++;
        document.getElementById('movesDisplay').textContent = moves;
      }

      pathHistory.push(word);
      renderHistory();
      document.getElementById('currentWordDisplay').textContent = word;

      if (word === targetWord) {
        choicesArea.innerHTML = '';
        document.getElementById('finalMoves').textContent = moves;
        document.getElementById('victoryOverlay').style.display = 'flex';
        return;
      }

      renderChoices(definitions);
    }

    // --- Rendering Choices ---
    function renderChoices(definitions) {
      choicesArea.innerHTML = '';

      definitions.forEach((def, index) => {
        const card = document.createElement('div');
        card.className = 'def-card';
        card.innerHTML = `
          <span class="def-pos">${def.partOfSpeech}</span>
          <div class="def-preview">${def.text}</div>
        `;
        card.onclick = () => openActiveModal(def.text);
        choicesArea.appendChild(card);
      });
    }

    // --- Modal Logic ---
    function openActiveModal(text) {
      modalDefContent.innerHTML = parseDefinitionToHTML(text);
      activeDefModal.style.display = 'flex';
    }

    function closeActiveModal() {
      activeDefModal.style.display = 'none';
    }

    function parseDefinitionToHTML(text) {
      const tokens = text.match(/[\w'-]+|[^\w'-]+/g) || [];
      return tokens.map(token => {
        if (/^[\w'-]+$/.test(token)) {
          const cleanWord = token.toLowerCase();
          const safeWord = cleanWord.replace(/'/g, "\\'");
          return `<span class="clickable-word" onclick="handleWordClick('${safeWord}')">${token}</span>`;
        }
        return token;
      }).join('');
    }

    // --- Hint Modals ---
    function showTargetHint() {
      const modal = document.getElementById('targetHintModal');
      const list = document.getElementById('hintList');
      document.getElementById('hintTitle').textContent = targetWord;

      list.innerHTML = '';

      if (targetDefinitions && targetDefinitions.length > 0) {
        targetDefinitions.slice(0, 3).forEach(def => {
          const li = document.createElement('li');
          li.innerHTML = `<strong style="font-family:'Bungee',cursive; font-size:0.8rem; padding: 0.2rem 0.5rem; background: var(--text-main); color: var(--surface); margin-right: 0.5rem; vertical-align: middle;">${def.partOfSpeech}</strong> <br><br> ${def.text}`;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = '<li>No definition found. You are flying blind!</li>';
      }
      modal.style.display = 'flex';
    }

    // --- History Logic ---
    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';

      pathHistory.forEach((word, index) => {
        const span = document.createElement('span');
        span.className = 'history-word';
        span.textContent = word;
        container.appendChild(span);

        if (index < pathHistory.length - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'history-arrow';
          arrow.textContent = '>';
          container.appendChild(arrow);
        }
      });

      container.scrollLeft = container.scrollWidth;
    }

    // --- Toast Logic ---
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>

</html>
