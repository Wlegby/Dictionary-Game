<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wikipedia Game: Funky Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;600;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #ffe600;
      /* Funky Yellow */
      --surface: #ffffff;
      --text-main: #000000;
      --primary: #ff0055;
      /* Hot Pink */
      --primary-hover: #cc0044;
      --accent: #00e5ff;
      /* Cyan */
      --success: #00ff66;
      /* Lime */
      --border: #000000;
      --shadow-offset: 8px;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      background-image: radial-gradient(var(--text-main) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      box-sizing: border-box;
    }

    h1,
    h2,
    h3 {
      font-family: 'Bungee', cursive;
      margin-top: 0;
      text-transform: uppercase;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 800px;
      border: 4px solid var(--border);
      border-radius: 0px;
      box-shadow: var(--shadow-offset) var(--shadow-offset) 0px var(--border);
      padding: 3rem;
      position: relative;
    }

    /* --- Funky Buttons --- */
    .btn {
      background-color: var(--primary);
      color: white;
      border: 3px solid var(--border);
      padding: 1rem 2rem;
      font-family: 'Bungee', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 4px 4px 0px var(--border);
      transition: all 0.1s ease;
      display: inline-block;
      text-decoration: none;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px var(--border);
    }

    .btn:active:not(:disabled) {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px var(--border);
    }

    .btn-small {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      background-color: var(--accent);
      color: var(--text-main);
    }

    /* --- Loading Spinner --- */
    #loader {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      z-index: 100;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Bungee', cursive;
      font-size: 1.5rem;
      color: var(--primary);
    }

    .spin {
      animation: spin 1s linear infinite;
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    /* --- Setup Section --- */
    #setupSection {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* --- Game Section --- */
    #gameSection {
      display: none;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 1.5rem;
      border-bottom: 4px solid var(--border);
      margin-bottom: 2rem;
      gap: 1rem;
    }

    .stat-block {
      background: var(--bg);
      border: 3px solid var(--border);
      padding: 0.5rem 1rem;
      box-shadow: 3px 3px 0 var(--border);
    }

    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .stat-value {
      font-family: 'Bungee', cursive;
      font-size: 1.5rem;
      color: var(--primary);
      word-break: break-all;
    }

    .word-display {
      font-family: 'Bungee', cursive;
      font-size: 3rem;
      color: var(--text-main);
      margin-bottom: 1rem;
      text-transform: lowercase;
      text-shadow: 2px 2px 0px var(--accent);
    }

    /* --- Definition Choices --- */
    #choicesArea {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .def-card {
      background: #f8f9fa;
      border: 3px solid var(--border);
      padding: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 4px 4px 0 var(--border);
    }

    .def-card:hover {
      background: var(--accent);
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 var(--border);
    }

    .def-pos {
      font-weight: bold;
      color: var(--primary);
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    /* --- Active Definition Area --- */
    #activeDefinitionArea {
      display: none;
      font-size: 1.5rem;
      line-height: 1.8;
      background: var(--accent);
      padding: 1.5rem;
      border: 3px solid var(--border);
      box-shadow: 5px 5px 0 var(--border);
      margin-bottom: 2rem;
    }

    /* Magic Clickable Words */
    .clickable-word {
      color: var(--text-main);
      cursor: pointer;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-decoration-color: var(--primary);
      transition: all 0.2s ease;
      padding: 0 2px;
    }

    .clickable-word:hover {
      background-color: var(--primary);
      color: white;
    }

    /* --- Modals (Victory & Target Hint) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background: var(--surface);
      border: 4px solid var(--border);
      box-shadow: 10px 10px 0 var(--primary);
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-content.victory {
      box-shadow: 10px 10px 0 var(--success);
      background: #e6ffed;
    }

    .hint-def-list {
      text-align: left;
      font-size: 1.1rem;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .hint-def-list li {
      margin-bottom: 0.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px dashed var(--border);
    }

    /* --- History Trail --- */
    .history-trail {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 4px solid var(--border);
      font-size: 1rem;
      line-height: 1.6;
    }

    .history-word {
      font-weight: 700;
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border: 2px solid var(--border);
      display: inline-block;
      margin-bottom: 0.5rem;
    }

    .history-arrow {
      margin: 0 0.5rem;
      font-family: 'Bungee', cursive;
      color: var(--primary);
    }

    /* --- Toast Notification --- */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--primary);
      color: white;
      border: 3px solid var(--border);
      box-shadow: 4px 4px 0 var(--border);
      padding: 1rem 2rem;
      font-family: 'Bungee', cursive;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 2000;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="loader">
      <div class="spin">🌀</div>
      <div id="loaderText">Fetching Dictionary...</div>
    </div>

    <div id="setupSection">
      <h1>Funky Dictionary</h1>
      <p style="font-size: 1.2rem; font-weight: 600; text-align: center;">
        Navigate from a random start word to a random target word by clicking words in the definitions!
      </p>
      <button id="startGameBtn" class="btn">Start The Madness</button>
    </div>

    <div id="gameSection">
      <div class="game-header">
        <div>
          <div class="stat-block">
            <div class="stat-label">Target Word</div>
            <div id="targetDisplay" class="stat-value"></div>
          </div>
          <button class="btn btn-small" style="margin-top: 0.5rem;" onclick="showTargetHint()">👀 View Target
            Definition</button>
        </div>
        <div class="stat-block" style="text-align: right; background: var(--success);">
          <div class="stat-label">Moves</div>
          <div id="movesDisplay" class="stat-value text-main">0</div>
        </div>
      </div>

      <div id="currentWordDisplay" class="word-display"></div>

      <h3>Choose Your Path:</h3>
      <div id="choicesArea"></div>

      <div id="activeDefinitionArea"></div>

      <div class="history-trail" id="historyTrail">
        <strong>PATH TAKEN: </strong><br><br>
        <div id="historyList"></div>
      </div>
    </div>
  </div>

  <div id="targetHintModal" class="modal-overlay">
    <div class="modal-content">
      <h2>Target: <span id="hintTitle" style="color: var(--primary);"></span></h2>
      <ul id="hintList" class="hint-def-list"></ul>
      <button class="btn" onclick="document.getElementById('targetHintModal').style.display='none'">Got it!</button>
    </div>
  </div>

  <div id="victoryOverlay" class="modal-overlay">
    <div class="modal-content victory">
      <h2 style="font-size: 3rem; margin-bottom: 0;">AWESOME! 🎉</h2>
      <p style="font-size: 1.5rem; font-weight: bold;">You reached the target in <span id="finalMoves"
          style="color: var(--primary); font-size: 2rem;"></span> moves.</p>
      <button class="btn" onclick="location.reload()">Play Again</button>
    </div>
  </div>

  <div id="toast" class="toast">
    <span id="toastMessage">Word not found!</span>
  </div>

  <script>
    // A curated list of well-connected common words to use as start and target points
    const baseWords = [
      "time", "year", "people", "way", "day", "man", "thing", "woman", "life", "child",
      "world", "school", "state", "family", "student", "group", "country", "problem",
      "hand", "part", "place", "case", "week", "company", "system", "program", "question",
      "work", "government", "number", "night", "point", "home", "water", "room", "mother",
      "area", "money", "story", "fact", "month", "right", "study", "book", "eye", "job",
      "word", "business", "issue", "side", "kind", "head", "house", "service", "friend",
      "father", "power", "hour", "game", "line", "end", "member", "law", "car", "city",
      "community", "name", "president", "team", "minute", "idea", "kid", "body", "information",
      "back", "parent", "face", "level", "office", "door", "health", "person", "art", "war",
      "history", "party", "result", "change", "morning", "reason", "research", "girl", "guy",
      "moment", "air", "teacher", "force", "education", "science", "music", "nature"
    ];

    let currentWord = "";
    let targetWord = "";
    let targetDefinitions = [];
    let pathHistory = [];
    let moves = 0;
    let toastTimeout;

    // --- DOM Elements ---
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loaderText');
    const startBtn = document.getElementById('startGameBtn');

    startBtn.addEventListener('click', startNewGame);

    // --- API Logic ---
    async function fetchWordDefinition(word) {
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
        if (!response.ok) return null;

        const data = await response.json();
        let allDefs = [];

        // Flatten the deep JSON structure into an array of definitions
        data.forEach(entry => {
          entry.meanings.forEach(meaning => {
            meaning.definitions.forEach(def => {
              allDefs.push({
                partOfSpeech: meaning.partOfSpeech,
                text: def.definition
              });
            });
          });
        });

        return allDefs;
      } catch (error) {
        console.error("API Error:", error);
        return null;
      }
    }

    // --- Game Setup ---
    async function startNewGame() {
      // Pick Random Words
      let start = baseWords[Math.floor(Math.random() * baseWords.length)];
      targetWord = baseWords[Math.floor(Math.random() * baseWords.length)];

      while (start === targetWord) {
        targetWord = baseWords[Math.floor(Math.random() * baseWords.length)];
      }

      document.getElementById('setupSection').style.display = 'none';
      document.getElementById('gameSection').style.display = 'block';
      document.getElementById('targetDisplay').textContent = targetWord;

      // Pre-fetch target definitions for the hint modal
      targetDefinitions = await fetchWordDefinition(targetWord);

      await navigateToWord(start, true);
    }

    // --- Navigation Logic ---
    window.handleWordClick = async function (word) {
      const cleanWord = word.replace(/^[^\w]+|[^\w]+$/g, '').toLowerCase();

      loader.style.display = 'flex';
      loaderText.textContent = `Searching for "${cleanWord}"...`;

      const definitions = await fetchWordDefinition(cleanWord);

      loader.style.display = 'none';

      if (!definitions || definitions.length === 0) {
        showToast(`Bummer! "${cleanWord}" wasn't found in the API.`);
        return;
      }

      navigateToWord(cleanWord, false, definitions);
    }

    async function navigateToWord(word, isStart = false, preFetchedDefs = null) {
      let definitions = preFetchedDefs;

      if (isStart) {
        loader.style.display = 'flex';
        loaderText.textContent = `Loading starting word...`;
        definitions = await fetchWordDefinition(word);
        loader.style.display = 'none';
      }

      currentWord = word;

      if (!isStart) {
        moves++;
        document.getElementById('movesDisplay').textContent = moves;
      }

      pathHistory.push(word);
      renderHistory();
      document.getElementById('currentWordDisplay').textContent = word;

      // Check Win Condition
      if (word === targetWord) {
        document.getElementById('choicesArea').style.display = 'none';
        document.getElementById('activeDefinitionArea').style.display = 'none';
        document.getElementById('finalMoves').textContent = moves;
        document.getElementById('victoryOverlay').style.display = 'flex';
        return;
      }

      renderChoices(definitions);
    }

    // --- Rendering Choices ---
    function renderChoices(definitions) {
      const choicesArea = document.getElementById('choicesArea');
      const activeArea = document.getElementById('activeDefinitionArea');

      choicesArea.innerHTML = '';
      choicesArea.style.display = 'flex';
      activeArea.style.display = 'none';

      // Limit to max 5 choices to prevent overwhelm
      const maxDefs = definitions.slice(0, 5);

      maxDefs.forEach((def, index) => {
        const card = document.createElement('div');
        card.className = 'def-card';
        card.innerHTML = `
          <span class="def-pos">[${def.partOfSpeech}]</span>
          ${def.text}
        `;
        card.onclick = () => activateDefinition(def.text);
        choicesArea.appendChild(card);
      });
    }

    function activateDefinition(text) {
      const choicesArea = document.getElementById('choicesArea');
      const activeArea = document.getElementById('activeDefinitionArea');

      choicesArea.style.display = 'none'; // Hide choices
      activeArea.style.display = 'block'; // Show magic words

      activeArea.innerHTML = parseDefinitionToHTML(text);
    }

    // Parse string into clickable tokens
    function parseDefinitionToHTML(text) {
      const tokens = text.match(/[\w'-]+|[^\w'-]+/g) || [];
      return tokens.map(token => {
        if (/^[\w'-]+$/.test(token)) {
          const cleanWord = token.toLowerCase();
          // Escape quotes in the inline click handler
          const safeWord = cleanWord.replace(/'/g, "\\'");
          return `<span class="clickable-word" onclick="handleWordClick('${safeWord}')">${token}</span>`;
        }
        return token;
      }).join('');
    }

    // --- Hint Modal Logic ---
    function showTargetHint() {
      const modal = document.getElementById('targetHintModal');
      const list = document.getElementById('hintList');
      document.getElementById('hintTitle').textContent = targetWord;

      list.innerHTML = '';

      if (targetDefinitions && targetDefinitions.length > 0) {
        // Show up to 3 definitions to not give away the farm
        targetDefinitions.slice(0, 3).forEach(def => {
          const li = document.createElement('li');
          li.innerHTML = `<strong style="color:var(--primary)">[${def.partOfSpeech}]</strong> ${def.text}`;
          list.appendChild(li);
        });
      } else {
        list.innerHTML = '<li>No definition found. You are flying blind!</li>';
      }

      modal.style.display = 'flex';
    }

    // --- History Logic ---
    function renderHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '';

      pathHistory.forEach((word, index) => {
        const span = document.createElement('span');
        span.className = 'history-word';
        span.textContent = word;
        container.appendChild(span);

        if (index < pathHistory.length - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'history-arrow';
          arrow.textContent = '>';
          container.appendChild(arrow);
        }
      });
    }

    // --- Toast Logic ---
    function showToast(message) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMessage').textContent = message;
      toast.classList.add('show');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>

</html>
